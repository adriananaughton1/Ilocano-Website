<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ilocano Flashcards</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav class="navbar">
    <div class="logo">Learn Ilocano</div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="categories.html">Vocabulary</a>
    </div>
  </nav>

  <main class="flashcard-page">

    <a class="back-link" href="categories.html">← Back to Vocabulary</a>

    <div class="flashcard-header">
      <p class="breadcrumb">Vocabulary → Food & Drinks → Flashcards</p>
      <h1>Food & Drinks</h1>
      <p>Practice your Ilocano vocabulary.</p>
    </div>

    <div class="flashcard-container">

      <div class="flashcard" id="flashcard">
        <p class="flashcard-label">Ilocano</p>

        <h2 id="flashcard-word">Makan</h2>

        <p id="flashcard-answer">Click to reveal</p>
      </div>

    </div>

    <div class="flashcard-progress">
      <span id="card-number">1</span> / <span id="total-cards">10</span>
    </div>

    <div class="flashcard-controls">
      <button id="previous-button">← Previous</button>
      <button id="next-button">Next →</button>
    </div>

  </main>

  <script src="vocabulary.js"></script>
  <script src="script.js"></script>

</body>
</html>
